<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fakestore</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body>
    <header class="flex items-center justify-between px-15 py-4 bg-orange-500">
        <div>
            <input type="text" placeholder="Digite o número do produto" class="w-120 h-10 rounded bg-white pl-4"/>
        </div>
        <div>
            <select name="" id="categorias" class="h-10 rounded bg-white px-4">
                <option value="">Men's Clothing</option>
                <option value="">Women's Clothing</option>
                <option value="">Eletronics</option>
                <option value="">Jewelery</option>
            </select>

            <select name="" id="" class="h-10 rounded bg-white px-4">
                <option value="">Ordenar por preço</option>
                <option value="">Ordenar por avaliação</option>
            </select>
        </div>
    </header>

    <main class="p-15 bg-slate-200">
        <div id="cards" class="grid grid-cols-4 gap-4">
            <div>
                <img src="" alt="" class="h-[55] object-contain">
                <div class="p-2 bg-orange-500 text-white font-bold">4.0</div>
            </div>
        </div>
    </main>

    <script src="main.js"></script><script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</body>
</html>
